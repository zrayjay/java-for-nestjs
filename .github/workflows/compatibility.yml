name: Compatibility probe

on:
  push:
    paths:
      - 'examples/compatibility-probe/**'
      - '.github/workflows/compatibility.yml'
  pull_request:
    paths:
      - 'examples/compatibility-probe/**'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
        stack: ['boot3', 'boot4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: examples/compatibility-probe/pom.xml
      - name: Toolchain
        run: |
          java -version
          ./mvnw --version
          docker version
      - name: Verify integrated baseline
        shell: bash
        run: |
          pom=pom.xml
          if [ '${{ matrix.stack }}' = boot4 ]; then pom=pom-boot4.xml; fi
          ./mvnw --batch-mode --no-transfer-progress -f "examples/compatibility-probe/$pom" clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.stack }}-java-${{ matrix.java }}
          path: examples/compatibility-probe/target/surefire-reports/
