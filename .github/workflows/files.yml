name: Private file teaching labs
on:
  push:
    paths:
      - 'examples/file-lab/**'
      - 'examples/nestjs-security-reference/**'
      - 'pnpm-lock.yaml'
      - 'pom.xml'
      - '.github/workflows/files.yml'
  pull_request:
    paths:
      - 'examples/file-lab/**'
      - 'examples/nestjs-security-reference/**'
      - 'pnpm-lock.yaml'
      - 'pom.xml'
      - '.github/workflows/files.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  files:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    env:
      FILES_ENDPOINT: http://127.0.0.1:9000
      FILES_ACCESS_KEY: teaching-minio
      FILES_SECRET_KEY: disposable-files-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Start disposable private object store
        run: |
          docker run --detach --name teaching-files --publish 127.0.0.1:9000:9000 --env MINIO_ROOT_USER="$FILES_ACCESS_KEY" --env MINIO_ROOT_PASSWORD="$FILES_SECRET_KEY" minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --address :9000
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs teaching-files
          exit 1
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.9 --filter @java-for-nestjs/nestjs-security-reference... build
      - name: Java PNG attacks and actual private object ownership
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/file-lab/pom.xml verify
      - name: Node PNG attacks and actual private object ownership
        run: node --test examples/nestjs-security-reference/dist/files.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-results-java-${{ matrix.java }}
          path: |
            examples/file-lab/target/surefire-reports/
            examples/file-lab/target/checkstyle-result.xml
      - name: Remove disposable object store
        if: always()
        run: docker rm --force teaching-files
