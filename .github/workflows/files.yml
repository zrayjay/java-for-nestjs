name: Private file teaching labs
on:
  push:
    paths:
      - 'examples/file-lab/**'
      - 'examples/nestjs-security-reference/**'
      - 'pnpm-lock.yaml'
      - 'pom.xml'
      - '.github/workflows/files.yml'
  pull_request:
    paths:
      - 'examples/file-lab/**'
      - 'examples/nestjs-security-reference/**'
      - 'pnpm-lock.yaml'
      - 'pom.xml'
      - '.github/workflows/files.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  files:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    env:
      FILES_ENDPOINT: http://127.0.0.1:9000
      FILES_ACCESS_KEY: teaching-minio
      FILES_SECRET_KEY: disposable-files-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
          path: target/minio-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: target/minio-source/go.sum
      - name: Build pinned official MinIO source
        working-directory: target/minio-source
        env:
          GOTOOLCHAIN: local
        run: go build -trimpath -o ../minio-server .
      - name: Start disposable private object store
        env:
          MINIO_ROOT_USER: ${{ env.FILES_ACCESS_KEY }}
          MINIO_ROOT_PASSWORD: ${{ env.FILES_SECRET_KEY }}
          MINIO_BROWSER: 'off'
        run: |
          nohup target/minio-server server target/minio-data --address 127.0.0.1:9000 > target/minio-service.log 2>&1 &
          echo $! > target/minio.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.9 --filter @java-for-nestjs/nestjs-security-reference... build
      - name: Java PNG attacks and actual private object ownership
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/file-lab/pom.xml verify
      - name: Node PNG attacks and actual private object ownership
        run: node --test examples/nestjs-security-reference/dist/files.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-results-java-${{ matrix.java }}
          path: |
            examples/file-lab/target/surefire-reports/
            examples/file-lab/target/checkstyle-result.xml
      - name: Stop disposable object store
        if: always()
        run: |
          if [ -f target/minio.pid ]; then kill "$(cat target/minio.pid)"; fi
