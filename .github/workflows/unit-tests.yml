name: Isolated unit teaching labs
on:
  push:
    paths:
      - 'examples/file-lab/**'
      - 'examples/nestjs-security-reference/**'
      - 'pnpm-lock.yaml'
      - 'pom.xml'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'examples/file-lab/**'
      - 'examples/nestjs-security-reference/**'
      - 'pnpm-lock.yaml'
      - 'pom.xml'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.9 --filter @java-for-nestjs/nestjs-security-reference... build
      - name: Repeat isolated tests in fresh processes without SQL, Redis or S3
        shell: pwsh
        run: |
          $wrapper = if ($IsWindows) { '.\mvnw.cmd' } else { './mvnw' }
          foreach ($iteration in 1..2) {
            & $wrapper --batch-mode --no-transfer-progress -f examples/file-lab/pom.xml '-Dtest=PngSanitizerTest,PrivateFilesUnitTest' verify
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --test examples/nestjs-security-reference/dist/files.unit.spec.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npx --yes pnpm@10.34.9 --filter @java-for-nestjs/nestjs-security-reference exec vitest run src/files.vitest.spec.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            examples/file-lab/target/surefire-reports/
            examples/file-lab/target/checkstyle-result.xml
