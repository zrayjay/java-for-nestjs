name: Foundation quality

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - name: Native JDK HTTP loopback regression
        run: java examples/compatibility-probe/tools/HttpClientProbe.java
      - name: Java style, compile and tests with pinned Wrapper
        shell: pwsh
        run: |
          if ($IsWindows) { .\mvnw.cmd --batch-mode --no-transfer-progress clean verify }
          else { ./mvnw --batch-mode --no-transfer-progress clean verify }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npx --yes pnpm@10.34.9 examples:build
      - run: npx --yes pnpm@10.34.9 examples:test
      - run: npx --yes pnpm@10.34.9 examples:verify
      - name: Resolved Maven model and core bytecode boundary
        shell: pwsh
        run: ./scripts/verify-build-model.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-results-${{ matrix.os }}-${{ matrix.java }}
          path: |
            examples/**/target/surefire-reports/
            examples/**/target/checkstyle-result.xml
            examples/java-basics/greeting-core/target/dependency-tree.json
            examples/java-basics/greeting-core/target/effective-pom.xml

  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.9 format:check
      - run: npx --yes pnpm@10.34.9 js:check
      - run: npx --yes pnpm@10.34.9 deps:audit
      - run: npx --yes pnpm@10.34.9 chapters:check
      - run: npx --yes pnpm@10.34.9 chapters:test

  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f project/deploy/compose/compose.yaml config --quiet
      - run: docker compose -f project/deploy/compose/compose.yaml up -d --wait --wait-timeout 180
      - name: Verify database and cache
        run: |
          docker compose -f project/deploy/compose/compose.yaml exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1"'
          docker compose -f project/deploy/compose/compose.yaml exec -T redis redis-cli ping
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose -f project/deploy/compose/compose.yaml logs --no-color
          docker compose -f project/deploy/compose/compose.yaml down
