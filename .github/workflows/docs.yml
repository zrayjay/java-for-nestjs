name: Documentation site

on:
  push:
    paths:
      - 'docs/**'
      - 'examples/compatibility-probe/README.md'
      - 'scripts/**'
      - 'chapter-map.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/compatibility-probe/README.md'
      - 'scripts/**'
      - 'chapter-map.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCS_BASE: /java-for-nestjs/

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Install pinned dependencies
        run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - name: Check Vue and config types
        run: npx --yes pnpm@10.34.9 docs:typecheck
      - run: npx --yes pnpm@10.34.9 chapters:test
      - run: npx --yes pnpm@10.34.9 chapters:check
      - name: Build documentation with dead-link checks
        run: npx --yes pnpm@10.34.9 docs:build
      - name: Verify generated course index is committed
        run: git diff --exit-code -- docs/course/index.md docs/.vitepress/course.json
      - run: npx --yes pnpm@10.34.9 docs:links
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ matrix.os }}
          path: docs/.vitepress/dist/
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
