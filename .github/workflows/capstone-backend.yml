name: Capstone backend

on:
  push:
    paths:
      - 'project/pom.xml'
      - 'project/apps/admin-server/**'
      - 'project/apps/admin-web/**'
      - 'project/java-modules/**'
      - 'project/deploy/compose/Capstone.Dockerfile'
      - 'project/deploy/compose/capstone.yaml'
      - 'project/deploy/compose/verify-capstone.mjs'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'config/checkstyle.xml'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - '.github/workflows/capstone-backend.yml'
  pull_request:
    paths:
      - 'project/pom.xml'
      - 'project/apps/admin-server/**'
      - 'project/apps/admin-web/**'
      - 'project/java-modules/**'
      - 'project/deploy/compose/Capstone.Dockerfile'
      - 'project/deploy/compose/capstone.yaml'
      - 'project/deploy/compose/verify-capstone.mjs'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'config/checkstyle.xml'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - '.github/workflows/capstone-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_DATABASE: capstone_test
          MYSQL_USER: capstone_test
          MYSQL_PASSWORD: capstone-test-password
          MYSQL_ROOT_PASSWORD: capstone-test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pcapstone-test-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CAPSTONE_TEST_DB_PORT: '3306'
      CAPSTONE_TEST_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Initialize the checksummed Maven Wrapper distribution
        run: |
          if ! ./mvnw --version; then
            MVNW_REPOURL=https://repo1.maven.org/maven2 ./mvnw --version
            echo "MVNW_REPOURL=https://repo1.maven.org/maven2" >> "$GITHUB_ENV"
          fi
      - name: Verify the reactor and HTTP contracts with MySQL and Redis
        run: ./mvnw --batch-mode --no-transfer-progress -f project/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capstone-backend-java-${{ matrix.java }}
          path: project/apps/admin-server/target/surefire-reports/
          retention-days: 7
  admin-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.9 --filter @java-for-nestjs/admin-web build
      - run: npx --yes pnpm@10.34.9 --filter @java-for-nestjs/admin-web test
  deployment-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAPSTONE_IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CAPSTONE_REVISION: ${{ github.sha }}
      CAPSTONE_DATABASE_PASSWORD: ci-capstone-database-password
      CAPSTONE_MYSQL_ROOT_PASSWORD: ci-capstone-root-password
      CAPSTONE_ADMIN_USERNAME: capstone-ci
      CAPSTONE_ADMIN_PASSWORD: ci-capstone-administrator-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Build the matching Vue and Spring artifacts
        run: docker compose -f project/deploy/compose/capstone.yaml build app
      - name: Start an empty deployment and wait for health
        run: docker compose -f project/deploy/compose/capstone.yaml up -d --no-build --wait --wait-timeout 160
      - name: Verify the same-origin web and API deployment
        run: node project/deploy/compose/verify-capstone.mjs
      - name: Collect deployment diagnostics
        if: failure()
        run: docker compose -f project/deploy/compose/capstone.yaml logs --no-color --tail 160
      - name: Remove the ephemeral CI deployment
        if: always()
        run: docker compose -f project/deploy/compose/capstone.yaml down --volumes
