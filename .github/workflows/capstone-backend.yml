name: Capstone backend

on:
  push:
    paths:
      - 'project/pom.xml'
      - 'project/apps/admin-server/**'
      - 'project/apps/admin-web/**'
      - 'project/java-modules/**'
      - 'project/deploy/compose/Capstone.Dockerfile'
      - 'project/deploy/compose/capstone.yaml'
      - 'project/deploy/compose/verify-capstone.mjs'
      - 'project/deploy/compose/capstone-observability.yaml'
      - 'project/deploy/compose/database-backup.mjs'
      - 'project/deploy/compose/monitoring/**'
      - 'project/deploy/compose/verify-alert.mjs'
      - 'project/deploy/compose/verify-recovery.mjs'
      - 'examples/security-lab/src/main/java/dev/javafornestjs/security/KeyTool.java'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'config/checkstyle.xml'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - '.github/workflows/capstone-backend.yml'
  pull_request:
    paths:
      - 'project/pom.xml'
      - 'project/apps/admin-server/**'
      - 'project/apps/admin-web/**'
      - 'project/java-modules/**'
      - 'project/deploy/compose/Capstone.Dockerfile'
      - 'project/deploy/compose/capstone.yaml'
      - 'project/deploy/compose/verify-capstone.mjs'
      - 'project/deploy/compose/capstone-observability.yaml'
      - 'project/deploy/compose/database-backup.mjs'
      - 'project/deploy/compose/monitoring/**'
      - 'project/deploy/compose/verify-alert.mjs'
      - 'project/deploy/compose/verify-recovery.mjs'
      - 'examples/security-lab/src/main/java/dev/javafornestjs/security/KeyTool.java'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'config/checkstyle.xml'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - '.github/workflows/capstone-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_DATABASE: capstone_test
          MYSQL_USER: capstone_test
          MYSQL_PASSWORD: capstone-test-password
          MYSQL_ROOT_PASSWORD: capstone-test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pcapstone-test-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CAPSTONE_TEST_DB_PORT: '3306'
      CAPSTONE_TEST_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Initialize the checksummed Maven Wrapper distribution
        run: |
          if ! ./mvnw --version; then
            MVNW_REPOURL=https://repo1.maven.org/maven2 ./mvnw --version
            echo "MVNW_REPOURL=https://repo1.maven.org/maven2" >> "$GITHUB_ENV"
          fi
      - name: Verify the reactor and HTTP contracts with MySQL and Redis
        run: ./mvnw --batch-mode --no-transfer-progress -f project/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capstone-backend-java-${{ matrix.java }}
          path: project/apps/admin-server/target/surefire-reports/
          retention-days: 7
  admin-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.9 --filter @java-for-nestjs/admin-web build
      - run: npx --yes pnpm@10.34.9 --filter @java-for-nestjs/admin-web test
  deployment-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAPSTONE_IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CAPSTONE_REVISION: ${{ github.sha }}
      CAPSTONE_DATABASE_PASSWORD: ci-capstone-database-password
      CAPSTONE_MYSQL_ROOT_PASSWORD: ci-capstone-root-password
      CAPSTONE_ADMIN_USERNAME: capstone-ci
      CAPSTONE_ADMIN_PASSWORD: ci-capstone-administrator-password
      CAPSTONE_RECOVERY_PASSWORD: ci-capstone-recovery-fixture-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Build the matching Vue and Spring artifacts
        run: docker compose -f project/deploy/compose/capstone.yaml build app
      - name: Start an empty deployment and wait for health
        run: docker compose -f project/deploy/compose/capstone.yaml up -d --no-build --wait --wait-timeout 160
      - name: Verify the same-origin web and API deployment
        run: node project/deploy/compose/verify-capstone.mjs
      - name: Restore orders and audit data into a fresh database
        run: |
          cd project/deploy/compose
          node verify-recovery.mjs seed "$RUNNER_TEMP/capstone-fixture.json"
          node database-backup.mjs backup java-for-nestjs-capstone .env.capstone.example "$RUNNER_TEMP/capstone-backup"
          export CAPSTONE_HTTP_PORT=18093
          docker compose -p capstone-ci-restore -f capstone.yaml up -d --wait --wait-timeout 160 mysql
          node database-backup.mjs restore capstone-ci-restore .env.capstone.example "$RUNNER_TEMP/capstone-backup"
          counts=$(docker compose -p capstone-ci-restore -f capstone.yaml exec -T mysql sh -ec '
            export MYSQL_PWD="$MYSQL_PASSWORD"
            mysql -ucapstone capstone -N -e "SELECT CONCAT((SELECT COUNT(*) FROM sys_session_family), char(58), (SELECT COUNT(*) FROM sys_refresh_session))"
          ')
          test "$counts" = '0:0'
          docker compose -p capstone-ci-restore -f capstone.yaml up -d --no-build --wait --wait-timeout 160
          CAPSTONE_BASE_URL=http://127.0.0.1:18093 node verify-recovery.mjs compare "$RUNNER_TEMP/capstone-fixture.json"
      - name: Trigger and resolve a monitoring alert
        run: |
          cd project/deploy/compose
          compose=(docker compose -f capstone.yaml -f capstone-observability.yaml)
          "${compose[@]}" up -d --no-build --wait --wait-timeout 160
          node verify-alert.mjs healthy
          "${compose[@]}" stop app
          node verify-alert.mjs firing
          "${compose[@]}" up -d --no-build --wait --wait-timeout 160 app
          node verify-alert.mjs recovered
          "${compose[@]}" stop mysql
          node verify-alert.mjs api-errors-sample
          sleep 7
          node verify-alert.mjs api-errors-sample
          "${compose[@]}" up -d --no-build --wait --wait-timeout 160 mysql
          curl --fail --silent --show-error --max-time 3 --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:18092/readyz
          node verify-alert.mjs api-errors-firing
      - name: Collect deployment diagnostics
        if: failure()
        run: |
          cd project/deploy/compose
          docker compose -f capstone.yaml -f capstone-observability.yaml logs --no-color --tail 160
          docker compose -p capstone-ci-restore -f capstone.yaml logs --no-color --tail 160
      - name: Remove the ephemeral CI deployment
        if: always()
        run: |
          cd project/deploy/compose
          docker compose -p capstone-ci-restore -f capstone.yaml down --volumes
          docker compose -f capstone.yaml -f capstone-observability.yaml down --volumes
