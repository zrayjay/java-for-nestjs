name: Teaching delivery rollback

on:
  push:
    paths:
      - 'project/deploy/**'
      - 'examples/security-lab/**'
      - 'examples/data-access-lab/**'
      - 'examples/spring-web-lab/**'
      - 'pom.xml'
      - '.mvn/**'
      - '.dockerignore'
      - 'scripts/verify-k8s-delivery.mjs'
      - '.github/workflows/delivery.yml'
  pull_request:
    paths:
      - 'project/deploy/**'
      - 'examples/security-lab/**'
      - 'examples/data-access-lab/**'
      - 'examples/spring-web-lab/**'
      - 'pom.xml'
      - '.mvn/**'
      - '.dockerignore'
      - 'scripts/verify-k8s-delivery.mjs'
      - '.github/workflows/delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-and-rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Install pinned kubectl ahead of a broken runner kubectl
        run: |
          mkdir -p ./bin
          curl -sSLo ./bin/kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          chmod +x ./bin/kubectl
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Reveal which kubectl the drill will invoke
        run: |
          echo "PATH=$PATH"
          type -a kubectl || true
          command -v kubectl || true
          kubectl version --client=true 2>&1 | head -2 || true
          ls -la "$(command -v kubectl)" 2>/dev/null || true
      - name: Install pinned kind
        run: |
          curl -sSLo ./kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          chmod +x ./kind
      - name: Build the delivery image
        run: docker build --build-arg BUILD_MARKER=ci-${{ github.sha }} -f project/deploy/compose/Dockerfile -t java-for-nestjs-teaching:ci .
      - name: Scan for unpatched HIGH/CRITICAL vulnerabilities (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: java-for-nestjs-teaching:ci
          format: json
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: project/deploy/trivy-ignore.yaml
          output: trivy-report.json
      - name: Always upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.json
          retention-days: 7
      - name: Create real kind cluster
        run: ./kind create cluster --name p5-delivery --image kindest/node:v1.34.0 --wait 180s
      - name: Pre-pull mysql so kubelet never hits Docker Hub rate limits
        run: |
          docker pull mysql:8.4.7
          ./kind load docker-image mysql:8.4.7 --name p5-delivery
      - name: Deploy v1, roll to v2, undo, verify markers and business continuity
        run: node scripts/verify-k8s-delivery.mjs
        env:
          KIND_CLUSTER_NAME: p5-delivery
      - name: Always delete the cluster this job created
        if: always()
        run: ./kind delete cluster --name p5-delivery || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-rollback-evidence
          path: target/delivery-evidence/
          retention-days: 7
