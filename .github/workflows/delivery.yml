name: Teaching delivery rollback

on:
  push:
    paths:
      - 'project/deploy/**'
      - 'examples/security-lab/**'
      - 'examples/data-access-lab/**'
      - 'examples/spring-web-lab/**'
      - 'examples/java-basics/**'
      - 'examples/spring-boot-examples/**'
      - 'config/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.dockerignore'
      - 'scripts/verify-k8s-delivery.mjs'
      - '.github/workflows/delivery.yml'
  pull_request:
    paths:
      - 'project/deploy/**'
      - 'examples/security-lab/**'
      - 'examples/data-access-lab/**'
      - 'examples/spring-web-lab/**'
      - 'examples/java-basics/**'
      - 'examples/spring-boot-examples/**'
      - 'config/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - '.dockerignore'
      - 'scripts/verify-k8s-delivery.mjs'
      - '.github/workflows/delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-and-rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Install pinned kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/delivery-bin"
          cd "$RUNNER_TEMP/delivery-bin"
          curl -fsSLO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Install pinned kind
        run: |
          curl -fsSLo ./kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          chmod +x ./kind
      - name: Build and check the delivery candidates
        run: |
          node --check scripts/verify-k8s-delivery.mjs
          docker build --build-arg BUILD_MARKER="drill-v1-$GITHUB_SHA" -f project/deploy/compose/Dockerfile -t java-for-nestjs-teaching:v1 .
          docker build --build-arg BUILD_MARKER=drill-v2-rollback-target -f project/deploy/compose/Dockerfile -t java-for-nestjs-teaching:v2 .
      - name: Scan v1 for fixable HIGH/CRITICAL vulnerabilities (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: java-for-nestjs-teaching:v1
          format: json
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: project/deploy/trivy-ignore.yaml
          output: trivy-v1.json
      - name: Scan v2 for fixable HIGH/CRITICAL vulnerabilities (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: java-for-nestjs-teaching:v2
          format: json
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: project/deploy/trivy-ignore.yaml
          output: trivy-v2.json
      - name: Always upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-v*.json
          retention-days: 7
      - name: Create real kind cluster
        run: ./kind create cluster --name p5-delivery --image kindest/node:v1.34.0 --wait 180s
      - name: Pre-pull mysql so kubelet never hits Docker Hub rate limits
        run: |
          docker pull mysql:8.4.7
          ./kind load docker-image mysql:8.4.7 --name p5-delivery
      - name: Deploy v1, roll to v2, undo, verify markers and business continuity
        run: node scripts/verify-k8s-delivery.mjs
        env:
          DELIVERY_USE_PREBUILT: '1'
          KIND_BIN: ./kind
          KIND_CLUSTER_NAME: p5-delivery
      - name: Always delete the cluster this job created
        if: always()
        run: ./kind delete cluster --name p5-delivery || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-rollback-evidence
          path: target/delivery-evidence/
          retention-days: 7
