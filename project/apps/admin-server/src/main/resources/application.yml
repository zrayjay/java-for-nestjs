spring:
  application:
    name: capstone-admin
  datasource:
    url: ${CAPSTONE_JDBC_URL}
    username: ${CAPSTONE_DATABASE_USER}
    password: ${CAPSTONE_DATABASE_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: ${CAPSTONE_REDIS_HOST:127.0.0.1}
      port: ${CAPSTONE_REDIS_PORT:6379}
      connect-timeout: 300ms
      timeout: 300ms

capstone:
  security:
    signing-key: ${CAPSTONE_SIGNING_KEY}
    verification-key: ${CAPSTONE_VERIFICATION_KEY}
  bootstrap:
    username: ${CAPSTONE_ADMIN_USERNAME:}
    password: ${CAPSTONE_ADMIN_PASSWORD:}
  menu-cache:
    enabled: ${CAPSTONE_MENU_CACHE_ENABLED:false}

server:
  address: ${CAPSTONE_BIND_ADDRESS:127.0.0.1}
  port: ${CAPSTONE_PORT:8091}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
