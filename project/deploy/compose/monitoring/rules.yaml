groups:
  - name: capstone
    rules:
      - alert: CapstoneScrapeUnavailable
        expr: up{job="capstone"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: Capstone metrics target is unavailable
          description: Check the application container, readiness, and internal metrics listener.
      - alert: CapstoneApiServerErrors
        expr: sum(increase(http_server_requests_seconds_count{job="capstone", uri=~"/api/v1/.*", status=~"5.."}[5m])) >= 5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Capstone API has sustained server errors
          description: Check recent request completion logs and correlate failures with request IDs.
