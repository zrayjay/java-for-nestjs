name: java-for-nestjs-dev

services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-java_for_nestjs}
      MYSQL_USER: ${MYSQL_USER:-course}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-only-course}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-only-root}
    ports:
      - '127.0.0.1:${MYSQL_PORT:-13306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysql --protocol=tcp -h127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  redis:
    image: redis:7.4.6-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-16379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mysql_data:
  redis_data:
