import org.gradle.api.DefaultTask
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.CacheableTask
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.OutputFile
import org.gradle.api.tasks.TaskAction

@CacheableTask
abstract class GenerateGreeting extends DefaultTask {
    @Input
    abstract Property<String> getLearner()

    @OutputFile
    abstract RegularFileProperty getDestination()

    @TaskAction
    void generate() {
        def output = destination.get().asFile
        output.parentFile.mkdirs()
        output.setText("Hello, ${learner.get()}!\n", 'UTF-8')
    }
}

def greeting = tasks.register('generateGreeting', GenerateGreeting) {
    learner.set(providers.gradleProperty('learner').orElse('NestJS'))
    destination.set(layout.buildDirectory.file('greeting.txt'))
}

tasks.register('verifyGreeting') {
    dependsOn(greeting)
    doLast {
        def expected = "Hello, ${providers.gradleProperty('learner').orElse('NestJS').get()}!\n"
        assert greeting.get().destination.get().asFile.getText('UTF-8') == expected
    }
}
